services:
  shivasha-seva-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGODB_URI: ${MONGODB_URI:-mongodb://shivasha-database:27017/shivasha}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://devops-saurabhpandey.github.io}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in the server secret environment}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(async r => { const d = await r.json(); process.exit(r.ok && d.database === 'connected' ? 0 : 1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shivasha-shared

networks:
  shivasha-shared:
    external: true
    name: shivasha_default
